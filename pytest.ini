[pytest]
testpaths = tests
# The app and vslam packages are imported as top-level names, so the repo root
# has to be on sys.path. Setting it here means `pytest` works from a clean
# checkout with no install step and no PYTHONPATH incantation.
pythonpath = .

filterwarnings =
    # Treat OUR deprecations as failures -- a warning nobody reads is a warning
    # that becomes a breakage at the worst moment.
    error::DeprecationWarning
    # ...but not dependencies' internal ones, which we cannot fix and which
    # would otherwise fail collection entirely. Starlette's TestClient reaches
    # anyio through a deprecated alias on this version combination.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
