# nginx in front of uvicorn, with TLS.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/slam
#   sudo ln -sf /etc/nginx/sites-available/slam /etc/nginx/sites-enabled/slam
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# WHY THERE IS A HOSTNAME AND NOT JUST AN IP
#
# Publicly-trusted certificates are not issued for bare IP addresses by the
# ordinary ACME path, so HTTPS needs a DNS name. sslip.io is a free wildcard
# resolver that needs no registration: 13.63.181.231.sslip.io resolves to
# 13.63.181.231 by construction, which is enough for Let's Encrypt's HTTP-01
# challenge to succeed and for a browser to show a valid certificate.
#
# THIS FILE IS THE SOURCE OF TRUTH, NOT THE BOX
#
# `certbot --nginx` would happily rewrite the live config, and the next deploy
# from this repository would silently revert it, breaking TLS with no obvious
# cause. So the certificate is obtained with `certbot certonly` and the server
# blocks are maintained here.

server {
    listen 80 default_server;
    server_name _;

    # Renewal must keep working. certbot's HTTP-01 challenge is served over
    # port 80, so this location has to be reachable BEFORE the redirect below,
    # or the certificate silently stops renewing in 60 days.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://13.63.181.231.sslip.io$request_uri;
    }
}

server {
    # `listen ... http2` rather than the standalone `http2 on;` directive:
    # the latter arrived in nginx 1.25.1 and Ubuntu 24.04 ships 1.24.0, where
    # it fails config validation outright with "unknown directive".
    listen 443 ssl http2;
    server_name 13.63.181.231.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/13.63.181.231.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.63.181.231.sslip.io/privkey.pem;
    # Mozilla's intermediate profile: TLS 1.2 and 1.3 only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # THE SETTING THAT BREAKS VIDEO UPLOADS IF YOU FORGET IT.
    #
    # nginx defaults client_max_body_size to 1 MB. Every video upload would be
    # rejected with a 413 generated by nginx itself -- before FastAPI ever sees
    # the request, so the app's own 25 MB limit and its friendly message would
    # never run. The failure looks like an application bug and is not one.
    #
    # Set slightly above the app's cap so the app is the thing that enforces
    # the limit and explains it, and nginx is only a backstop.
    client_max_body_size 26m;

    # Upload streams straight through rather than buffering the whole file to
    # disk first. Lower latency to the 202, and no double write.
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous enough for a 25 MB upload on a poor connection. The
        # RECONSTRUCTION never rides on a request -- POST returns 202 in
        # milliseconds and progress is polled -- so these timeouts only ever
        # cover the upload itself, never the processing.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Caching is set by the application (see AppStatic in app/main.py), not
    # here. Doing it in both places emitted two Cache-Control headers for
    # /vendor/, and more importantly it meant the behaviour differed between
    # running locally and running behind nginx -- so a caching bug could only
    # ever reproduce in one of the two environments. One source of truth.

    gzip on;
    gzip_types text/css application/javascript application/json;
    # The point cloud JSON is the big response and compresses very well:
    # it is mostly repetitive decimal numbers.
    gzip_min_length 1024;
}
